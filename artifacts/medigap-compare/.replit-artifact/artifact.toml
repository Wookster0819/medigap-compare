kind = "web"
previewPath = "/"
title = "Medigap Price Comparison"
version = "1.0.0"
id = "artifacts/medigap-compare"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20588

[services.development]
run = "pnpm --filter @workspace/medigap-compare run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/medigap-compare", "run", "build" ]
serve = "static"
publicDir = "artifacts/medigap-compare/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20588"
BASE_PATH = "/"
