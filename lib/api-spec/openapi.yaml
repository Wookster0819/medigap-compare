openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Medigap Plan Price Comparison API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: plans
    description: Medigap plan operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /plans:
    get:
      operationId: getPlans
      tags: [plans]
      summary: Get Medigap plans
      description: Returns available Medigap plans for a given zip code and age. Pass householdEligible=true only when two members of the same household are both enrolling — eligibility rules vary by insurer.
      parameters:
        - name: zip
          in: query
          required: true
          schema:
            type: string
        - name: age
          in: query
          required: true
          schema:
            type: number
        - name: householdEligible
          in: query
          required: false
          description: Whether the applicant may qualify for a household discount. Eligibility criteria differ by insurer — see householdEligibility on each plan.
          schema:
            type: boolean
        - name: planLetter
          in: query
          required: false
          schema:
            type: string
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of matching Medigap plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MedigapPlan"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /plans/summary:
    get:
      operationId: getPlansSummary
      tags: [plans]
      summary: Get pricing summary for an area
      description: Returns aggregated pricing stats for all plan types in the area
      parameters:
        - name: zip
          in: query
          required: true
          schema:
            type: string
        - name: age
          in: query
          required: true
          schema:
            type: number
        - name: householdEligible
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Plan summary by letter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlansSummary"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /plans/letters:
    get:
      operationId: getPlanLetters
      tags: [plans]
      summary: Get all Medigap plan letter definitions
      description: Returns explanations and coverage details for each plan letter
      responses:
        "200":
          description: List of plan letter definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanLetterDef"

  /plans/zip-info:
    get:
      operationId: getZipInfo
      tags: [plans]
      summary: Resolve a zip code to state and county
      parameters:
        - name: zip
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Zip code info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZipInfo"
        "404":
          description: Zip not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MedigapPlan:
      type: object
      properties:
        id:
          type: number
        insurerName:
          type: string
        planLetter:
          type: string
        monthlyPremium:
          type: number
        annualDeductible:
          type: number
        outOfPocketLimit:
          type: ["number", "null"]
        amBestRating:
          type: string
        moodyRating:
          type: ["string", "null"]
        yearsInBusiness:
          type: number
        householdDiscountRate:
          type: ["number", "null"]
          description: Per-insurer household discount rate (e.g. 0.07 = 7%). null means this insurer does not offer a household discount. Rates and eligibility rules differ by insurer.
        householdEligibility:
          type: ["string", "null"]
          description: Insurer-specific eligibility requirement for the household discount.
        householdDiscountNotes:
          type: ["string", "null"]
          description: Additional context about this insurer's household discount policy.
        householdDiscountApplied:
          type: boolean
          description: Whether the household discount was applied to this plan's monthlyPremium in this response.
        notes:
          type: ["string", "null"]
        planType:
          type: string
        partBDeductibleCovered:
          type: boolean
        foreignTravelCovered:
          type: boolean
      required:
        - id
        - insurerName
        - planLetter
        - monthlyPremium
        - annualDeductible
        - outOfPocketLimit
        - amBestRating
        - moodyRating
        - yearsInBusiness
        - householdDiscountRate
        - householdEligibility
        - householdDiscountNotes
        - householdDiscountApplied
        - notes
        - planType
        - partBDeductibleCovered
        - foreignTravelCovered

    PlansSummary:
      type: object
      properties:
        state:
          type: string
        county:
          type: string
        totalPlans:
          type: number
        lowestPremium:
          type: number
        highestPremium:
          type: number
        medianPremium:
          type: number
        byLetter:
          type: array
          items:
            $ref: "#/components/schemas/PlanLetterSummary"
        popularPlanLetter:
          type: string
      required:
        - state
        - county
        - totalPlans
        - lowestPremium
        - highestPremium
        - medianPremium
        - byLetter
        - popularPlanLetter

    PlanLetterSummary:
      type: object
      properties:
        letter:
          type: string
        count:
          type: number
        minPremium:
          type: number
        maxPremium:
          type: number
        avgPremium:
          type: number
      required:
        - letter
        - count
        - minPremium
        - maxPremium
        - avgPremium

    PlanLetterDef:
      type: object
      properties:
        letter:
          type: string
        headline:
          type: string
        description:
          type: string
        partACoinsurance:
          type: boolean
        partBCoinsurance:
          type: boolean
        partBDeductible:
          type: boolean
        partADeductible:
          type: boolean
        skilledNursing:
          type: boolean
        foreignTravel:
          type: boolean
        outOfPocketLimit:
          type: boolean
        popularity:
          type: string
      required:
        - letter
        - headline
        - description
        - partACoinsurance
        - partBCoinsurance
        - partBDeductible
        - partADeductible
        - skilledNursing
        - foreignTravel
        - outOfPocketLimit
        - popularity

    ZipInfo:
      type: object
      properties:
        zip:
          type: string
        city:
          type: string
        state:
          type: string
        stateCode:
          type: string
        county:
          type: string
        region:
          type: string
      required:
        - zip
        - city
        - state
        - stateCode
        - county
        - region
